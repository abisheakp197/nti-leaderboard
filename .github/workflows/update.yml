name: Update Leaderboard Data

on:
  push:
    branches:
      - main
    paths:
      - 'tracked_repos.json'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install nti-scanner

      - name: Run data pipeline
        run: python scripts/update_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "NTI Bot"
          git config --global user.email "bot@nti.dev"
          git add src/data/leaderboard.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated leaderboard scan [skip ci]" && git push)
