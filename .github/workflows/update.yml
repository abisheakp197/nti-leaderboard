name: Update Leaderboard Data

on:
  push:
    branches:
      - main
    paths:
      - 'tracked_repos.json'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned deliberately: results must be reproducible across machines.
          # Python 3.11 silently drops files that use 3.12+ grammar (e.g. PEP 695
          # `type X = ...`) because ast.parse fails, which understates both line
          # counts and findings. Pin the minor version, not a moving '3.x'.
          # Keep in lockstep with the scanner version in requirements.txt.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data pipeline
        run: python scripts/update_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "NTI Bot"
          git config --global user.email "bot@nti.dev"
          git add src/data/leaderboard.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated leaderboard scan [skip ci]" && git push)
